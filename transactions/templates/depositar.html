{% extends 'base.html' %}

{% block title %}Depósito - PicPato Banco{% endblock %}

{% block content %}

    <div class="auth-form-container">
        
        <div style="display: flex; gap: 10px; margin-bottom: 30px;">
            <a href="{% url 'depositar' %}" class="button-primary" 
               style="flex: 1; text-align: center; text-decoration: none; padding: 12px; background-color: #f0f0f0; color: #666; border: 1px solid #ddd;">
               ⬇ Depósito
            </a>

            <a href="{% url 'transferir' %}" class="button-primary" 
               style="flex: 1; text-align: center; text-decoration: none; padding: 12px;">
               ➡ Transferência
            </a>
        </div>

        <form method="post" action="{% url 'depositar' %}">
            <h2>Realizar Depósito</h2>
            <p style="text-align: center; color: var(--text-medium); margin-top: -20px; margin-bottom: 25px;">
                (Este é um depósito simulado. O valor será adicionado ao seu saldo.)
            </p>

            {% csrf_token %} 

            {{ form.as_p }}
            
            <button type="submit" class="button-primary">Confirmar Depósito</button>
        </form>

        <p class="auth-switch-link">
            <a href="{% url 'home' %}">Cancelar e voltar</a>
        </p>
    </div>

{% endblock %}
